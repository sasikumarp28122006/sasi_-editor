      L 246 226
      L 190 226
      L 190 258
      L 246 258
      L 246 428
      L 146 285
      L 146 318
      L 204 318
      L 204 356
      L 146 356
      L 146 226
      Z" />

    <!-- RIGHT MONOGRAM 'K' (WHITE) -->
    <!-- Vertical Stem -->
    <path fill="#FFFFFF" d="
      M 254 178
      L 292 178
      L 292 405
      L 254 428
      Z" />

    <!-- Upper Arm & Lower Leg of K -->
    <path fill="#FFFFFF" d="
