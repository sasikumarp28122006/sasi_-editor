<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- SK Crown Emblem Logo -->
  <g id="sk-logo">
    <!-- ================= CROWN ================= -->
    <!-- Left Crown Half (RED) -->
    <path fill="#E50914" d="
      M 250 168 
      L 172 168 
      L 146 115 
      L 182 142 
      L 192 86 
      L 222 132 
      L 250 70 
      Z" />
    
    <!-- Right Crown Half (WHITE) -->
    <path fill="#FFFFFF" d="
      M 250 168 
      L 250 70 
      L 278 132 
      L 308 86 
      L 318 142 
      L 354 115 
      L 328 168 
      Z" />

    <!-- Crown Ball Tips -->
    <circle cx="146" cy="115" r="10" fill="#E50914"/>
    <circle cx="192" cy="86" r="10" fill="#E50914"/>
    
    <!-- Center Split Ball Tip -->
    <path fill="#E50914" d="M 250 60 A 10 10 0 0 0 250 80 Z"/>
    <path fill="#FFFFFF" d="M 250 60 A 10 10 0 0 1 250 80 Z"/>

    <circle cx="308" cy="86" r="10" fill="#FFFFFF"/>
    <circle cx="354" cy="115" r="10" fill="#FFFFFF"/>

    <!-- ================= MONOGRAM SHIELD (S & K) ================= -->
    
